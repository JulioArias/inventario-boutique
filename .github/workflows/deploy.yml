name: Laravel CI Pipeline

on:
  push:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: database/database.sqlite

    steps:

    - name: Descargar proyecto
      uses: actions/checkout@v4

    - name: Instalar PHP
      uses: shivammathur/setup-php@v2

      with:
        php-version: '8.2'
        extensions: mbstring, pdo_sqlite, xml, bcmath, intl

    - name: Instalar Composer
      run: composer install --no-interaction --prefer-dist

    - name: Desactivar bloqueo de advisories de Composer en CI
      run: composer config policy.advisories.block false

    - name: Copiar .env
      run: cp .env.example .env

    - name: Generar APP_KEY
      run: php artisan key:generate

    - name: Preparar SQLite para pruebas
      run: |
        mkdir -p database
        touch database/database.sqlite
        php artisan migrate --no-interaction || true

    - name: Ejecutar pruebas
      run: php artisan test