name: Auto Update Dependencies

on:
  workflow_dispatch:

jobs:
  update-deps:
    runs-on: ubuntu-latest
    env:
      COMPOSER_ALLOW_SUPERUSER: 1
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, pdo_sqlite, xml, bcmath, intl

    - name: Disable composer advisory blocking
      run: composer config policy.advisories.block false

    - name: Install Composer deps (baseline)
      run: composer install --no-interaction --prefer-dist

    - name: Run composer update
      run: composer update --with-all-dependencies --no-interaction

    - name: Prepare sqlite
      run: |
        mkdir -p database
        touch database/database.sqlite
        php artisan migrate --no-interaction || true

    - name: Run tests
      run: php artisan test || true

    - name: Commit and push updated lock
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        if git status --porcelain | grep -E "composer.lock|composer.json"; then
          branch="update-deps-$(date +%s)"
          git checkout -b "$branch"
          git add composer.lock composer.json || true
          git commit -m "chore: update composer dependencies (CI)" || echo "no commit"
          git push origin "$branch"
        else
          echo "No composer changes to commit"
        fi
      env:
        GIT_TERMINAL_PROMPT: 0
